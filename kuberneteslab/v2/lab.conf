# lab.conf — shared configuration for the kubeadm Hyper-V lab.
# Source this from every other script: `source "$DIR/lab.conf"`
#
# Edit these to match your Hyper-V VMs (hostnames + static/DHCP-reserved IPs).

CONTROL_HOST="control"
CONTROL_IP="192.168.178.51"

WORKER_HOSTS=("worker01" "worker02")
WORKER_IPS=("192.168.178.52" "192.168.178.53")

# User to SSH as when reaching out to the workers from the control node.
# Must have passwordless SSH key auth AND passwordless sudo set up
# on all three VMs (see README.md) — otherwise remote commands will
# hang waiting for a password that has nowhere to be typed.
SSH_USER="${SSH_USER:-$USER}"

POD_SUBNET="10.244.0.0/16"

# Pinned, not "master" — avoids a redeploy silently picking up a
# breaking change in an add-on between runs.
CALICO_URL="https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml"
LOCAL_PATH_URL="https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml"
