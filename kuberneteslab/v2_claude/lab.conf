# ============================================================
# lab.conf — the ONLY file you should need to edit.
# Every other script reads its settings from here.
# ============================================================

# ---- SSH / access -------------------------------------------------
# The Linux user that exists on control/worker01/worker03 and can sudo.
SSH_USER="ubuntu"

# Path to an SSH key pair used for all normal (day-to-day) connections.
# 00_prepare-nodes.sh will generate this if it doesn't exist yet.
SSH_KEY="$HOME/.ssh/k8s_lab_ed25519"

# Password for SSH_USER on the VMs. ONLY used once, by
# 00_prepare-nodes.sh, to install the SSH key above and enable
# passwordless sudo. Blank it out (SSH_PASSWORD="") once that has
# run successfully — nothing else in this repo reads it.
# SECURITY: this is plaintext. Lab use only — never a real/shared password.
SSH_PASSWORD=""

# ---- Repo / working directory -------------------------------------
# Where this repo lives on YOUR machine (informational only).
LOCAL_REPO_PATH="$HOME/k8slabs"

# Where the lab scripts get copied to and executed from on EACH VM.
REMOTE_WORKDIR="/home/${SSH_USER}/k8s-lab"

# ---- Cluster nodes --------------------------------------------------
CONTROL_NAME="control"
CONTROL_IP="192.168.178.51"

WORKER_NAMES=("worker01" "worker03")
WORKER_IPS=("192.168.178.52" "192.168.178.53")

# ---- Kubernetes settings -------------------------------------------
# apt repo line to install from (pkgs.k8s.io). Must be a "vMAJOR.MINOR"
# line that actually exists, e.g. v1.31, v1.32, v1.33.
K8S_VERSION="v1.31"

POD_CIDR="10.244.0.0/16"

# ---- Add-ons (pinned versions — not "latest"/"master") -------------
CALICO_URL="https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml"
LOCAL_PATH_URL="https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml"
