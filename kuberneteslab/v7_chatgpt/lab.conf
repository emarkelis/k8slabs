# ============================================================================
# Kubernetes Lab v7 - central configuration
#
# This is the ONLY file you normally edit for a different lab.
# Keep SSH_PASSWORD empty except during initial access preparation.
# ============================================================================

# --------------------------- Repository / paths -----------------------------
LAB_REPO_URL="https://github.com/emarkelis/k8slabs"

# Local path where this v7_chatgpt directory is stored on the administration
# machine. It is used for logs and generated local secrets.
LAB_REPO_PATH="$HOME/k8slabs/k8slabs/kuberneteslab/v7_chatgpt"

# The same Linux account is expected on all three VMs.
SSH_USER="ubuntu"

# Directory used on every VM for deployment helper scripts and temporary files.
REMOTE_WORKDIR="/home/${SSH_USER}/k8s-lab-v7"

# Local output directory.
LOCAL_LOG_DIR="${LAB_REPO_PATH}/logs"

# ------------------------------ SSH / access --------------------------------
# Private key used by normal deployment, reset, status and kubeconfig download.
SSH_KEY_PATH="$HOME/.ssh/k8s_lab_v7_ed25519"

# ONLY needed by 00_prepare-nodes.sh when key-based access and/or passwordless
# sudo are not already configured. Empty this value afterwards.
# Never commit a real password to the public repository.
SSH_PASSWORD=""

# accept-new is convenient for a persistent lab and still rejects an unexpected
# host-key change. Do not use StrictHostKeyChecking=no unless you understand
# the security trade-off.
SSH_STRICT_HOST_KEY_CHECKING="accept-new"
SSH_CONNECT_TIMEOUT="10"

# ------------------------------ Kubernetes ----------------------------------
# There is a separate pkgs.k8s.io repository for each Kubernetes minor release.
# Change this value when you deliberately want another minor release.
K8S_MINOR_VERSION="v1.37"

# Optional exact Debian package version. Leave empty to install the newest
# available patch release in K8S_MINOR_VERSION.
K8S_PACKAGE_VERSION=""

POD_CIDR="10.244.0.0/16"
SERVICE_CIDR="10.96.0.0/12"
CLUSTER_DNS_DOMAIN="cluster.local"

# This lab is intended for Ubuntu 26.04 LTS.
REQUIRE_UBUNTU_VERSION="26.04"

# ------------------------------- Calico -------------------------------------
CALICO_VERSION="v3.32.2"
CALICO_URL="https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml"

# ------------------------- Local-path storage --------------------------------
LOCAL_PATH_VERSION="v0.0.37"
LOCAL_PATH_URL="https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml"

# local-path stores data under this directory on each node.
LOCAL_PATH_DATA_PATH="/opt/local-path-provisioner"

# true = a full lab reset also removes local-path data on the VMs.
# This is useful for clean repeatable exercises and is intentionally destructive
# for lab PersistentVolume data.
RESET_LOCAL_PATH_DATA="true"

# true = mark local-path as the default StorageClass.
DEFAULT_STORAGE_CLASS="true"

# ------------------------------- Cluster ------------------------------------
CONTROL_NAME="control"
CONTROL_IP="192.168.178.51"

WORKER_NAMES=("worker01" "worker03")
WORKER_IPS=("192.168.178.52" "192.168.178.53")

# Worker join tokens are explicitly short-lived.
JOIN_TOKEN_TTL="30m"

# Timeout for Calico/storage/node readiness after deployment.
CLUSTER_READY_TIMEOUT_SECONDS="900"
